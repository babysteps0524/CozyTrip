name: Generate hotel posts

on:
  workflow_dispatch:
    inputs:
      hotel_id:
        description: "재생성할 개별 호텔 ID (예: myrealtrip-5008360). 비워두면 일일 계획으로 생성"
        required: false
        type: string
      post_limit:
        description: "일일 계획을 사용하지 않을 때 생성할 게시글 수"
        required: false
        default: "1"
        type: string
      repair_invalid:
        description: "기존 게시글 중 v5 엄격 사실 검증에 실패한 글만 재생성"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: generate-hotel-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}
      MYREALTRIP_BASE_URL: ${{ secrets.MYREALTRIP_BASE_URL }}
      MYREALTRIP_IMAGE_USAGE_ALLOWED: "true"
      AI_HOTEL_ID: ${{ inputs.hotel_id }}
      AI_POST_LIMIT: ${{ inputs.post_limit || '1' }}
      AI_DAILY_PLAN: "japan-tokyo:3,japan-osaka:3,japan-kyoto:2,japan-fukuoka:2,japan-okinawa:1"
      AI_REPAIR_INVALID: ${{ inputs.repair_invalid || false }}

    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MYREALTRIP_API_KEY: ${{ secrets.MYREALTRIP_API_KEY }}
          MYREALTRIP_BASE_URL: ${{ secrets.MYREALTRIP_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${MYREALTRIP_API_KEY}" ]; then
            echo "::error::MYREALTRIP_API_KEY is not configured."
            exit 1
          fi

          if [ -z "${MYREALTRIP_BASE_URL}" ]; then
            echo "::error::MYREALTRIP_BASE_URL is not configured."
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY}" ] && [ -z "${GROQ_API_KEY}" ] && [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::At least one AI provider secret is required: GEMINI_API_KEY, GROQ_API_KEY, or OPENROUTER_API_KEY."
            exit 1
          fi

          echo "Required API secrets are configured."

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Auto-generate hotel posts
        if: ${{ !inputs.repair_invalid }}
        run: bun run autoPost

      - name: Auto-repair invalid hotel posts
        if: ${{ inputs.repair_invalid }}
        run: bun scripts/myrealtrip/generate-hotels.ts && bun run ai:repair && bun scripts/split-client-post-data.ts && bun scripts/generate-hotel-inventory.ts

      - name: Validate hotel data
        run: bun scripts/validate-hotel-data.ts

      - name: Validate hotel posts
        run: bun scripts/validate-hotel-posts.ts

      - name: Validate affiliate links
        run: bun scripts/validate-affiliate-links.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Validate SEO
        run: bun scripts/validate-seo.ts

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- src/data/generated/myrealtrip-hotels.json src/data/generated/hotel-posts.generated.json src/data/generated/hotel-post-failures.generated.json src/data/generated/hotel-post-run.generated.json src/data/generated/hotel-inventory.generated.json; then
            echo "No generated hotel data changes."
            exit 0
          fi

          git add src/data/generated/myrealtrip-hotels.json src/data/generated/hotel-posts.generated.json src/data/generated/hotel-post-failures.generated.json src/data/generated/hotel-post-run.generated.json src/data/generated/hotel-inventory.generated.json
          git commit -m "chore: refresh hotel inventory and posts"
          git push
